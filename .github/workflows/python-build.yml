name: Python Tests
run-name: Run Tests by ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: pytest selector to run instead of the full suite
        required: false
        default: ""
env:
  PIP_INDEX_URL: https://:2025-06-19T22:48:06.508410Z@time-machines-pypi.sealsecurity.io/
jobs:
  tests:
    timeout-minutes: 30
    env:
      FORCE_COLOR: 1
    strategy:
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install prereq
        run: pip install tox coveralls
      - name: Run python tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            pip install -r requirements-test.txt -e . && python -m pytest ${{ inputs.test-filter }}
          else
            tox -e ${{ matrix.python }}
          fi
  coveralls:
    name: Indicate completion to coveralls.io
    if: false
    timeout-minutes: 10
    needs: tests
    runs-on: ubuntu-latest
    container: python:3-slim
    permissions:
      contents: read
    steps:
      - name: Finished
        run: |
          pip3 install --upgrade coveralls
          coveralls --service=github --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docs:
    strategy:
      matrix:
        toxenv: ["docs", "readme"]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: sudo apt install -y graphviz
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install prereq
        run: pip install tox
      - name: Run python tests
        run: tox -e ${{ matrix.toxenv }}
  pypi-publish:
    needs:
      - tests
      - docs
    if: ${{ success() }}
    name: Upload release to PyPI
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install prereq
      run: pip install build twine
    - name: Build python package
      run: python -m build
    - name: Check python package
      run: twine check dist/*
    - name: Upload python package
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error
